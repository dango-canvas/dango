name: Release Extensions & Publish

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if tag or release already exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-extension:
    name: Release Extension & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version Release Check
        id: version_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(jq -r .version dango/manifest.json)
          echo "Current manifest version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # 1. Manual dispatch with force_release=true -> always release
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "Triggered via manual dispatch with force_release=true. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Check if GitHub Release already exists for this version
          if gh release view "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${CURRENT_VERSION} already exists. Skipping duplicate release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Release does not exist yet -> version is unreleased (new version or retry after failure)
          echo "GitHub Release v${CURRENT_VERSION} does not exist yet. Version ${CURRENT_VERSION} will be released."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Build Web app & Browser Extensions
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          bun run build.ts
          bun run build_extension.ts

      - name: Run automated test suite
        if: steps.version_check.outputs.should_release == 'true'
        run: bun test

      - name: Submit to Mozilla Add-ons (Firefox AMO)
        if: steps.version_check.outputs.should_release == 'true'
        shell: bash
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER || secrets.AMO_API_KEY }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail
          
          if [ -z "$AMO_KEY" ] || [ -z "$AMO_SECRET" ]; then
            echo "::warning ::Firefox AMO secrets (AMO_JWT_ISSUER/AMO_JWT_SECRET or AMO_API_KEY/AMO_API_SECRET) not found in repository secrets. Skipping AMO submission."
            exit 0
          fi

          echo "🚀 Submitting Firefox extension to AMO (Channel: listed, gecko id: dango-board@dango.ink)..."
          # Allow gracefully proceeding if version was already submitted to AMO in a previous attempt
          npx web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --api-key="$AMO_KEY" \
            --api-secret="$AMO_SECRET" \
            --source-dir=dist/extension-firefox || echo "::warning ::web-ext sign returned non-zero (AMO may already have received this version)."
          
          echo "✅ Submission handed off to Mozilla Add-ons successfully!"

      - name: Create Git Tag & GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
          GIT_TERMINAL_PROMPT: 0
        shell: bash
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="v${VERSION}"
          
          # Git tag (only push if remote doesn't have it)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Git tag $TAG already exists on repository."
          fi
          
          # Prepare standalone release assets
          cp dist/index.html dist/dango.html
          (cd dist && zip -9 dango.zip dango.html)
          
          # GitHub Release with non-interactive prompt disabled
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" \
              dist/dango.zip \
              --clobber < /dev/null
          else
            echo "Creating publication release for $TAG..."
            gh release create "$TAG" \
              dist/dango.zip \
              --title "Dango ${TAG}" \
              --generate-notes \
              --verify-tag < /dev/null
          fi
          
          echo "🎉 Release $TAG completed successfully!"

  release-docker:
    name: Build & Push Docker Image
    needs: release-extension
    if: needs.release-extension.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.release-extension.outputs.version }}
            type=raw,value=latest

      - name: Build single-file release
        run: bun build.ts

      - name: Package release checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release staging
          cp dist/index.html staging/dango.html

          (
            cd staging
            zip -9 ../release/dango.zip dango.html
          )
          (
            cd release
            sha256sum dango.zip > SHA256SUMS.txt
          )

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Upload checksums to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "v${{ needs.release-extension.outputs.version }}" release/SHA256SUMS.txt --clobber

      - name: Append release asset notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${{ needs.release-extension.outputs.version }}"
          REPO="${{ github.repository }}"
          REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}:${TAG}"

          gh release view "$TAG" --repo "$REPO" --json body --jq '.body' > /tmp/release-body.md
          if grep -q "## Release Assets" /tmp/release-body.md; then
            exit 0
          fi

          cp /tmp/release-body.md /tmp/release-assets-note.md
          printf "\n---\n\n## Release Assets\n\n- \`dango.zip\` (Standalone HTML bundle: \`dango.html\`)\n- Docker image: \`%s\`\n\n## Self-Host\n\n\`\`\`bash\ndocker run --rm -p 8080:80 %s\n\`\`\`\n" "$IMAGE" "$IMAGE" >> /tmp/release-assets-note.md

          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/release-assets-note.md
