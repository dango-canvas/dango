name: Release Extensions & Publish

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if tag already exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-extension:
    name: Release Extension & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version Release Check
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(jq -r .version dango/manifest.json)
          echo "Current manifest version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # 1. Manual dispatch with force_release=true -> always release
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "Triggered via manual dispatch with force_release=true. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Check if git tag v${CURRENT_VERSION} already exists
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Version v${CURRENT_VERSION} is already released (tag v${CURRENT_VERSION} exists). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Tag does not exist yet -> version is unreleased (new version or retry after failure)
          echo "Tag v${CURRENT_VERSION} does not exist yet. Version ${CURRENT_VERSION} will be released."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Build Web app & Browser Extensions
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          bun run build.ts
          bun run build_extension.ts

      - name: Run automated test suite
        if: steps.version_check.outputs.should_release == 'true'
        run: bun test

      - name: Submit to Mozilla Add-ons (Firefox AMO)
        if: steps.version_check.outputs.should_release == 'true'
        shell: bash
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER || secrets.AMO_API_KEY }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail
          
          if [ -z "$AMO_KEY" ] || [ -z "$AMO_SECRET" ]; then
            echo "::warning ::Firefox AMO secrets (AMO_JWT_ISSUER/AMO_JWT_SECRET or AMO_API_KEY/AMO_API_SECRET) not found in repository secrets. Skipping AMO submission."
            exit 0
          fi

          echo "🚀 Submitting Firefox extension to AMO (Channel: listed, gecko id: dango-board@dango.ink)..."
          npx web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --api-key="$AMO_KEY" \
            --api-secret="$AMO_SECRET" \
            --source-dir=dist/extension-firefox
          
          echo "✅ Submission handed off to Mozilla Add-ons successfully!"

      - name: Create Git Tag & GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="v${VERSION}"
          
          # Git tag
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          
          cp dist/index.html dist/dango.html
          
          # GitHub Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" \
              dist/dango.html \
              dist/dango-firefox.zip \
              dist/dango-chrome.zip \
              --clobber
          else
            echo "Creating publication release for $TAG..."
            gh release create "$TAG" \
              dist/dango.html \
              dist/dango-firefox.zip \
              dist/dango-chrome.zip \
              --title "Dango ${TAG}" \
              --generate-notes
          fi
          
          echo "🎉 Release $TAG completed successfully!"
