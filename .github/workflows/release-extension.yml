name: Release Extension & Publish to AMO

on:
  push:
    branches: [ master, main ]
    paths:
      - 'dango/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-extension:
    name: Release Extension & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for web-ext)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail
          
          CURRENT_VERSION=$(jq -r .version dango/manifest.json)
          echo "Current manifest version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          
          # If manual dispatch, always proceed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered via workflow_dispatch. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag condition: check if git tag already exists
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${CURRENT_VERSION} already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check before commit if available
          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            PREV_VERSION=$(git show "${BEFORE_SHA}:dango/manifest.json" 2>/dev/null | jq -r .version || echo "")
            echo "Previous manifest version: $PREV_VERSION"
            if [ "$PREV_VERSION" = "$CURRENT_VERSION" ]; then
              echo "Manifest version hasn't changed. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Run automated test suite
        if: steps.version_check.outputs.should_release == 'true'
        run: bun test

      - name: Build Web app & Browser Extensions
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          bun run build.ts
          bun run build_extension.ts

      - name: Submit to Mozilla Add-ons (Firefox AMO)
        if: steps.version_check.outputs.should_release == 'true'
        shell: bash
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER || secrets.AMO_API_KEY }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET || secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail
          
          if [ -z "$AMO_KEY" ] || [ -z "$AMO_SECRET" ]; then
            echo "::warning ::Firefox AMO secrets (AMO_JWT_ISSUER/AMO_JWT_SECRET or AMO_API_KEY/AMO_API_SECRET) not found in repository secrets. Skipping AMO submission."
            exit 0
          fi

          echo "🚀 Submitting Firefox extension to AMO (Channel: listed, gecko id: dango-board@dango.ink)..."
          npx web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --api-key="$AMO_KEY" \
            --api-secret="$AMO_SECRET" \
            --source-dir=dist/extension-firefox
          
          echo "✅ Submission handed off to Mozilla Add-ons successfully!"

      - name: Create Git Tag & GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="v${VERSION}"
          
          # Git tag
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          
          cp dist/index.html dist/dango.html
          
          # GitHub Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" \
              dist/dango.html \
              dist/dango-firefox.zip \
              dist/dango-chrome.zip \
              --clobber
          else
            echo "Creating publication release for $TAG..."
            gh release create "$TAG" \
              dist/dango.html \
              dist/dango-firefox.zip \
              dist/dango-chrome.zip \
              --title "Dango ${TAG}" \
              --generate-notes
          fi
          
          echo "🎉 Release $TAG completed successfully!"
